name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Build, Test & Safety Floor Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Stage 1 - Build & Unit Tests
        run: ./gradlew test --console=plain

      - name: Stage 2 - Adversarial Stress Fuzzing
        run: ./gradlew :tools:adversarial-fuzz:run --console=plain

      - name: Stage 3 - Benchmark Gate (committed datasets, offline)
        run: ./gradlew :tools:benchmark:run --args="--offline --gate fixtures/benchmark-baseline.json" --console=plain
